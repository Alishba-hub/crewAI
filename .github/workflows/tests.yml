name: Run Tests
'on': push
permissions:
  contents: read
env:
  OPENAI_API_KEY: fake-api-key
  PYTHONUNBUFFERED: 1
  BRAVE_API_KEY: fake-brave-key
  SNOWFLAKE_USER: fake-snowflake-user
  SNOWFLAKE_PASSWORD: fake-snowflake-password
  SNOWFLAKE_ACCOUNT: fake-snowflake-account
  SNOWFLAKE_WAREHOUSE: fake-snowflake-warehouse
  SNOWFLAKE_DATABASE: fake-snowflake-database
  SNOWFLAKE_SCHEMA: fake-snowflake-schema
  EMBEDCHAIN_DB_URI: sqlite:///test.db
jobs:
  tests:
    name: tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: true
      matrix:
        python-version:
        - '3.10'
        - '3.13'
        group:
        - 1
        - 2
        - 3
        - 4
        - 5
        - 6
        - 7
        - 8
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Restore global uv cache
      id: cache-restore
      uses: actions/cache/restore@v4
      with:
        path: '~/.cache/uv

          ~/.local/share/uv

          .venv

          '
        key: uv-main-py${{ matrix.python-version }}-${{ hashFiles('uv.lock') }}
        restore-keys: 'uv-main-py${{ matrix.python-version }}-

          '
    - name: Install uv
      uses: astral-sh/setup-uv@v6
      with:
        version: 0.8.4
        python-version: ${{ matrix.python-version }}
        enable-cache: false
    - name: Install the project
      run: uv sync --all-groups --all-extras
    - name: Restore test durations
      uses: actions/cache/restore@v4
      with:
        path: .test_durations_py*
        key: test-durations-py${{ matrix.python-version }}
    - name: Run tests (group ${{ matrix.group }} of 8)
      run: "PYTHON_VERSION_SAFE=$(echo \"${{ matrix.python-version }}\" | tr '.' '_')\nDURATION_FILE=\"../../.test_durations_py${PYTHON_VERSION_SAFE}\"\n\n# Temporarily always skip cached durations to fix test splitting\n# When durations don't match, pytest-split runs duplicate tests instead of splitting\necho \"Using even test splitting (duration cache disabled until fix merged)\"\nDURATIONS_ARG=\"\"\n\n# Original logic (disabled temporarily):\n# if [ ! -f \"$DURATION_FILE\" ]; then\n#   echo \"No cached durations found, tests will be split evenly\"\n#   DURATIONS_ARG=\"\"\n# elif git diff origin/${{ github.base_ref }}...HEAD --name-only 2>/dev/null | grep -q \"^tests/.*\\.py$\"; then\n#   echo \"Test files have changed, skipping cached durations to avoid mismatches\"\n#   DURATIONS_ARG=\"\"\n# else\n#   echo \"No test changes detected, using cached test durations for optimal splitting\"\n#   DURATIONS_ARG=\"--durations-path=${DURATION_FILE}\"\n# fi\n\ncd lib/crewai && uv run pytest \\\n  --block-network \\\n  --timeout=30 \\\n  -vv \\\n  --splits 8 \\\n  --group ${{ matrix.group }} \\\n  $DURATIONS_ARG \\\n  --durations=10 \\\n  -n auto \\\n  --maxfail=3\n"
    - name: Run tool tests (group ${{ matrix.group }} of 8)
      run: "cd lib/crewai-tools && uv run pytest \\\n  --block-network \\\n  --timeout=30 \\\n  -vv \\\n  --splits 8 \\\n  --group ${{ matrix.group }} \\\n  --durations=10 \\\n  -n auto \\\n  --maxfail=3\n"
    - name: Save uv caches
      if: steps.cache-restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: '~/.cache/uv

          ~/.local/share/uv

          .venv

          '
        key: uv-main-py${{ matrix.python-version }}-${{ hashFiles('uv.lock') }}
